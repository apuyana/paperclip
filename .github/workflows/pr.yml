name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Fork note: calling paperclipai/...@master drifts ahead of this tree and
    # fails jobs that expect scripts not present in the fork's pinned tag. Use
    # the in-repo workflow that matches the checkout. Gate still fail-closes to
    # ubuntu-latest here.
    uses: ./.github/workflows/pr-trusted.yml
