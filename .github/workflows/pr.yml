name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Fork note: calling paperclipai/...@master drifts ahead of this tree and
    # fails jobs that expect scripts not present at v2026.1012.0 (build:runtime,
    # server-boot-smoke, docker-compose-secrets tests). Use the in-repo workflow
    # that matches the checkout. Gate still fail-closes to ubuntu-latest here.
    uses: ./.github/workflows/pr-trusted.yml
